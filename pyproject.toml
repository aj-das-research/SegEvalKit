[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "segevalkit"
dynamic = ["version"]
description = "A holistic, literature-grounded toolkit for evaluating volumetric (CT/MR) medical image segmentation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Abhijit Das" }]
keywords = ["segmentation", "evaluation", "metrics", "medical imaging", "CT", "MRI", "NIfTI", "Dice", "Hausdorff", "surface dice"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "nibabel>=5.0",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "scikit-image>=0.21",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "jinja2>=3.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
sitk = ["SimpleITK>=2.3"]
interactive = ["plotly>=5.18"]
all = ["torch>=2.1", "SimpleITK>=2.3", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "pymdown-extensions>=10.8",
]

[project.scripts]
segevalkit = "segevalkit.cli:main"

[project.urls]
Homepage = "https://github.com/aj-das-research/SegEvalKit"
Documentation = "https://aj-das-research.github.io/SegEvalKit"
Issues = "https://github.com/aj-das-research/SegEvalKit/issues"

[tool.hatch.version]
path = "src/segevalkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/segevalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: needs a CUDA device",
  "reference: cross-checks against third-party reference implementations",
  "data: needs the real datasets under data/raw",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
